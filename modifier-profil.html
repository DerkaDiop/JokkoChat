<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le profil - JokkoChat</title>
</head>
<body>
    <header>
    <a href="profil.html">☰</a>
    <h1>✏️ Modifier le profil</h1>
</header>

<hr>
<form action="profil.html" method="get">
    <label for="nom-utilisateur">Nom d'utilisateur :</label>
<input type="text" id="nom-utilisateur" name="nom-utilisateur" value="Kader" required>

<br><br>
<label for="email">Email :</label>
<input type="email" id="email" name="email" value="kader@example.com" required>

<br><br>
<label for="bio">À propos :</label>
<textarea id="bio" name="bio" rows="4">Bienvenue sur mon profil JokkoChat !</textarea>

<br><br>
<button type="submit">💾 Enregistrer les modifications</button>

</form>

</body>
</html>
