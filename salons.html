<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salons - JokkoChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body class="page-app">

    <!-- Barre latérale -->
    <aside class="barre-laterale">
        <div class="logo logo-clair">
            <i class="fa-solid fa-comment-dots"></i>
            <span>Jokko<strong>Chat</strong></span>
        </div>

        <nav class="navigation">
            <a href="menu.html"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
            <a href="conversation.html"><i class="fa-solid fa-comments"></i><span>Messages</span></a>
            <a href="contacts.html"><i class="fa-solid fa-user-group"></i><span>Contacts</span></a>
            <a href="salons.html" class="actif"><i class="fa-solid fa-users"></i><span>Salons</span></a>
            <a href="messages-enregistres.html" class="masque-mobile"><i class="fa-solid fa-bookmark"></i><span>Enregistrés</span></a>
            <a href="profil.html"><i class="fa-regular fa-user"></i><span>Profil</span></a>
            <a href="parametres.html" class="masque-mobile"><i class="fa-solid fa-gear"></i><span>Paramètres</span></a>
        </nav>

        <div class="utilisateur">
            <div class="avatar"><span class="initiale-utilisateur">K</span><span class="pastille en-ligne"></span></div>
            <div>
                <p class="utilisateur-nom nom-utilisateur">Kader</p>
                <p class="utilisateur-statut">En ligne</p>
            </div>
        </div>

        <a href="index.html" class="btn-deconnexion" data-deconnexion>
            <i class="fa-solid fa-right-from-bracket"></i> Déconnexion
        </a>
    </aside>

    <main class="contenu">
        <header class="contenu-entete">
            <div>
                <h1>Salons de discussion</h1>
                <p>Rejoignez un salon pour échanger en groupe.</p>
            </div>
            <button type="button" class="btn btn-principal btn-auto" id="btn-creer-salon">
                <i class="fa-solid fa-plus"></i> Créer un salon
            </button>
        </header>

        <div class="zone-recherche">
            <div class="recherche">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" id="filtre-salons" placeholder="Rechercher un salon..."
                       aria-label="Rechercher un salon">
            </div>
        </div>

        <!-- Liste des salons (remplie par js/script.js) -->
        <ul class="liste-salons" id="liste-salons"></ul>
        <p class="aucun-resultat" id="aucun-salon" hidden>Aucun salon trouvé.</p>
    </main>

    <!-- Fenêtre « Créer un salon » -->
    <dialog class="fenetre" id="fenetre-salon">
        <form id="form-salon" class="formulaire" method="dialog" novalidate>
            <h2>Créer un salon</h2>
            <p class="sous-titre">Les autres étudiants pourront le rejoindre.</p>

            <div class="champ">
                <label for="nom-salon">Nom du salon</label>
                <div class="champ-saisie">
                    <i class="fa-solid fa-hashtag"></i>
                    <input type="text" id="nom-salon" name="nom" placeholder="Ex : Mathématiques"
                           maxlength="30" required>
                </div>
                <small class="erreur"></small>
            </div>

            <div class="fenetre-actions">
                <button type="button" class="btn btn-secondaire" id="btn-annuler-salon">Annuler</button>
                <button type="submit" class="btn btn-principal">Créer</button>
            </div>
        </form>
    </dialog>

    <script src="js/script.js"></script>
</body>
</html>
