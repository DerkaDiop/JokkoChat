<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - JokkoChat</title>
    <!-- Script anti-flash du thème -->
    <script src="js/theme.js"></script>
    <!-- Feuille de style globale -->
    <link rel="stylesheet" href="css/style.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-app">
    <!-- Barre latérale -->
    <aside class="barre-laterale">
        <div class="logo">
            <i class="fa-solid fa-comments"></i>
            <span>Jokko<strong>Chat</strong></span>
        </div>
        <nav class="navigation">
            <a href="menu.html"><i class="fa-solid fa-house"></i> Accueil</a>
            <a href="conversation.html"><i class="fa-solid fa-message"></i> Messages</a>
            <a href="contacts.html" class="actif"><i class="fa-solid fa-users"></i> Contacts</a>
            <a href="salons.html"><i class="fa-solid fa-comments"></i> Salons</a>
            <a href="messages-enregistres.html"><i class="fa-solid fa-bookmark"></i> Enregistrés</a>
            <a href="profil.html"><i class="fa-solid fa-user"></i> Profil</a>
            <a href="parametres.html"><i class="fa-solid fa-gear"></i> Paramètres</a>
        </nav>
        <div class="utilisateur">
            <div class="avatar initiale-utilisateur">D</div>
            <div>
                <div class="utilisateur-nom nom-utilisateur">Utilisateur</div>
                <div class="utilisateur-statut">En ligne</div>
            </div>
        </div>
        <a href="index.html" class="btn-deconnexion" data-deconnexion>
            <i class="fa-solid fa-right-from-bracket"></i> Déconnexion
        </a>
    </aside>

    <!-- Contenu principal -->
    <main class="contenu">
        <div class="contenu-entete">
            <div>
                <h1>Contacts</h1>
                <p>Retrouvez et discutez avec vos contacts.</p>
            </div>
        </div>

        <!-- Zone de recherche de contacts -->
        <div class="zone-recherche">
            <div class="recherche">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="recherche-contacts" placeholder="Rechercher un contact...">
            </div>
        </div>

        <!-- Liste des contacts (générée ou affichée dynamiquement par script.js) -->
        <section>
            <h2 style="font-size: 1.1rem; margin-bottom: 12px;">Mes contacts</h2>
            <ul id="liste-contacts" class="grille-contacts">
                <!-- Les contacts s'afficheront ici automatiquement -->
            </ul>
        </section>
    </main>

    <!-- Scripts de l'application -->
    <script src="js/resume.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
