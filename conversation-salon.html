<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Salon - JokkoChat</title>
</head>
<body>
    <header class="salon-header">
    <a href="salons.html">☰</a>
    <h2># Général</h2>
    <small>5 membres</small>
</header>

<hr>
<main class="salon-chat">

    <div class="messages-container">
        <div class="message message-recu">
    <span class="auteur">Fatou</span>
    <span class="heure">10:15</span>
    <p>Bonjour tout le monde ! 👋</p>
</div>
<div class="message message-recu">
    <span class="auteur">Moussa</span>
    <span class="heure">10:16</span>
    <p>Salut Fatou ! Comment allez-vous ?</p>
</div>
<div class="message message-envoye">
    <span class="auteur">Moi</span>
    <span class="heure">10:17</span>
    <p>Ça va bien ! Content de vous retrouver ici 😊</p>
</div>
<div class="message message-recu">
    <span class="auteur">Awa</span>
    <span class="heure">10:18</span>
    <p>Bienvenue dans le salon Général ! 🎉</p>
</div>

    </div>
    <footer class="message-input-area">
    <form action="#" method="post">
        <button type="button">+</button>
        <input type="text" placeholder="Écrire un message dans # Général..." required>
        <button type="button">😊</button>
        <button type="button">🎙️</button>
        <button type="button">🖼️</button>
        <button type="submit">✈️</button>
    </form>
</footer>

</main>

</body>
</html>
