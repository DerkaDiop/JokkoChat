<!DOCTYPE html>
<html lang="fr">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>JokkoChat</title>
</head>
<body>

    <h1>Bienvenue sur JokkoChat</h1>

    <p>Discuter. Partager. Rester connectés.</p>
    <h2>Créer un compte</h2>

    <form action="menu.html">
        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom">
        <br><br>
        <label for="email">Email :</label>
        <input type="email" id="email" name="email">
        <br><br>
        <label for="mot-de-passe">Mot de passe :</label>
        <input type="password" id="mot-de-passe" name="mot-de-passe">
        <br><br>
        <label for="confirmation">Confirmer le mot de passe :</label>
        <input type="password" id="confirmation" name="confirmation">
        <br><br>
        <button type="submit">S'inscrire</button>
    </form>
    <h2>Connexion</h2>
    <form action="menu.html">
        <label for="email-connexion">Email :</label>
        <input type="email" id="email-connexion" name="email-connexion">
        <br><br>
        <label for="mot-de-passe-connexion">Mot de passe :</label>
        <input type="password" id="mot-de-passe-connexion" name="mot-de-passe-connexion">
        <br><br>
        <button type="submit">Se connecter</button>

    </form>
</body>
</html>
